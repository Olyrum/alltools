<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Tributação</title>
    <!-- Biblioteca para ler arquivos CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Biblioteca para ler arquivos XLS/XLSX (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --border-color: #dee2e6;
        }
        
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: var(--bg-color); 
            color: #333; 
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { 
            color: var(--primary-color); 
            margin-bottom: 10px;
        }

        .upload-card { 
            background: #fff; 
            padding: 25px; 
            border-radius: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 25px;
            text-align: center;
            border: 1px dashed #adb5bd;
        }

        .upload-card label {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            display: block;
            margin-bottom: 15px;
        }

        input[type="file"] {
            padding: 10px;
            background: #e9ecef;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .table-container { 
            overflow-x: auto; 
            max-height: 75vh; 
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: none; /* Oculto até carregar o arquivo */
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            white-space: nowrap;
        }

        th, td { 
            border: 1px solid var(--border-color); 
            padding: 12px 15px; 
            text-align: left; 
            font-size: 14px; 
        }

        th { 
            background-color: var(--primary-color); 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 10;
            vertical-align: top;
        }

        .filter-input { 
            width: 100%; 
            padding: 6px; 
            box-sizing: border-box; 
            margin-top: 8px; 
            font-size: 13px; 
            font-weight: normal;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            color: #333;
        }
        
        .filter-input::placeholder {
            color: #999;
        }

        tr:nth-child(even) { background-color: #f8f9fa; }
        tr:hover { background-color: #e9ecef; }
        
        #loading {
            display: none;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: var(--primary-color);
        }

        .stats {
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
            display: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Visualizador de Planilha de Tributação</h1>
        <p>Importe seu arquivo (Excel ou CSV) para visualizar e filtrar os dados.</p>
    </div>

    <div class="upload-card">
        <label for="fileInput">Selecione o arquivo (.xls, .xlsx ou .csv)</label>
        <input type="file" id="fileInput" accept=".csv, .xls, .xlsx, application/vnd.ms-excel, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
    </div>
    
    <div id="loading">Processando arquivo, por favor aguarde...</div>
    
    <div class="stats" id="tableStats"></div>

    <div class="table-container" id="tableContainer">
        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        let globalData = [];
        let headerRow = [];
        let allowedColumnsIndices = [];

        // Colunas que o usuário solicitou para remover
        const columnsToRemove = [
            "Stat. Ncm",
            "Stat. Cest",
            "Status CFOP NFC-e",
            "Status Nat. Rec."
        ];

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('tableStats').style.display = 'none';

            const fileName = file.name.toLowerCase();
            const isExcel = fileName.endsWith('.xls') || fileName.endsWith('.xlsx');

            if (isExcel) {
                // Processar arquivo do Excel (XLS/XLSX) usando SheetJS
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, {type: 'array'});
                        
                        // Pega a primeira aba da planilha
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        // Converte para um array de arrays (mesmo formato que o PapaParse entrega)
                        const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                        
                        setTimeout(() => {
                            processData(jsonData);
                            document.getElementById('loading').style.display = 'none';
                        }, 100);
                    } catch (error) {
                        alert("Erro ao ler o arquivo Excel: " + error.message);
                        document.getElementById('loading').style.display = 'none';
                    }
                };
                reader.readAsArrayBuffer(file);
                
            } else {
                // Processar arquivo CSV usando PapaParse
                Papa.parse(file, {
                    complete: function(results) {
                        setTimeout(() => {
                            processData(results.data);
                            document.getElementById('loading').style.display = 'none';
                        }, 100);
                    },
                    error: function(err) {
                        alert("Erro ao ler o arquivo CSV: " + err.message);
                        document.getElementById('loading').style.display = 'none';
                    },
                    encoding: "ISO-8859-1", // Padrão comum no Brasil
                    skipEmptyLines: true
                });
            }
        });

        function processData(data) {
            // Encontrar a linha de cabeçalho real (ignorando o cabeçalho do relatório)
            let headerIndex = -1;
            for (let i = 0; i < data.length; i++) {
                // Converte a linha para string para facilitar a busca, pois os dados podem vir em vários formatos
                const rowStr = data[i].join(" "); 
                if (rowStr.includes("Identificação") && rowStr.includes("Produto")) {
                    headerIndex = i;
                    break;
                }
            }

            if (headerIndex === -1) {
                alert("Não foi possível encontrar a linha de cabeçalho padrão ('Identificação', 'Produto') na planilha. Verifique o formato.");
                return;
            }

            const rawHeader = data[headerIndex];
            allowedColumnsIndices = [];
            headerRow = [];

            // Filtrar cabeçalhos (remover colunas indesejadas e colunas vazias)
            for (let i = 0; i < rawHeader.length; i++) {
                const colName = rawHeader[i] ? String(rawHeader[i]).trim() : "";
                
                // Só adiciona se a coluna não estiver vazia e não estiver na lista de exclusão
                if (colName !== "" && !columnsToRemove.includes(colName)) {
                    allowedColumnsIndices.push(i);
                    headerRow.push(colName);
                }
            }

            // Extrair linhas de dados
            globalData = [];
            for (let i = headerIndex + 1; i < data.length; i++) {
                const row = data[i];
                
                // Pular linhas que são muito curtas/vazias (ex: rodapés do relatório)
                // Usando length real de dados preenchidos no array do excel
                const filledCells = row.filter(cell => cell !== undefined && cell !== "").length;
                if (filledCells < 3) continue;

                let filteredRow = [];
                for (let j = 0; j < allowedColumnsIndices.length; j++) {
                    // Tratar possíveis valores undefined que o Excel retorna
                    filteredRow.push(row[allowedColumnsIndices[j]] !== undefined ? String(row[allowedColumnsIndices[j]]) : "");
                }
                globalData.push(filteredRow);
            }

            renderTable();
            document.getElementById('tableContainer').style.display = 'block';
            updateStats(globalData.length);
        }

        function renderTable() {
            const thead = document.getElementById('tableHead');
            const tbody = document.getElementById('tableBody');
            
            thead.innerHTML = '';
            tbody.innerHTML = '';

            // Renderizar Cabeçalho com Filtros
            let trHead = document.createElement('tr');
            headerRow.forEach((headerText, index) => {
                let th = document.createElement('th');
                th.textContent = headerText;
                
                // Adicionar input de filtro
                let input = document.createElement('input');
                input.type = 'text';
                input.className = 'filter-input';
                input.placeholder = 'Filtrar...';
                input.dataset.colIndex = index;
                input.addEventListener('input', filterTable); 
                
                th.appendChild(document.createElement('br'));
                th.appendChild(input);
                trHead.appendChild(th);
            });
            thead.appendChild(trHead);

            // Renderizar Corpo Inicial
            renderRows(globalData);
        }

        function renderRows(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            // Otimização de performance
            const fragment = document.createDocumentFragment();
            
            data.forEach(row => {
                let tr = document.createElement('tr');
                row.forEach(cellData => {
                    let td = document.createElement('td');
                    td.textContent = cellData;
                    tr.appendChild(td);
                });
                fragment.appendChild(tr);
            });
            
            tbody.appendChild(fragment);
        }

        function filterTable() {
            const inputs = document.querySelectorAll('.filter-input');
            const filters = Array.from(inputs).map(input => input.value.toLowerCase().trim());

            const filteredData = globalData.filter(row => {
                for (let i = 0; i < filters.length; i++) {
                    const filterVal = filters[i];
                    if (filterVal) {
                        const cellVal = (row[i] || "").toLowerCase();
                        if (!cellVal.includes(filterVal)) {
                            return false; // Se não bater com o filtro, oculta a linha
                        }
                    }
                }
                return true;
            });

            renderRows(filteredData);
            updateStats(filteredData.length);
        }

        function updateStats(count) {
            const stats = document.getElementById('tableStats');
            stats.textContent = `Mostrando ${count} produto(s) de um total de ${globalData.length}.`;
            stats.style.display = 'block';
        }
    </script>
</body>
</html>
