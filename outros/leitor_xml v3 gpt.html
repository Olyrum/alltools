<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Leitor XML Fiscal</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

body{
    font-family:Arial;
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.upload{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-bottom:20px;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h2{
    font-size:18px;
    margin-bottom:10px;
}

.card p{
    font-size:28px;
    color:#1565c0;
    font-weight:bold;
}

.tabs{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.tab{
    background:#1565c0;
    color:white;
    padding:10px 20px;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

.tab.active{
    background:#0d47a1;
}

.content{
    display:none;
}

.content.active{
    display:block;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

th{
    background:#1565c0;
    color:white;
    padding:12px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
    text-align:center;
}

tr:hover{
    background:#f5f5f5;
}

button.exportar{
    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:5px;
    cursor:pointer;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="container">

<h1>📄 Leitor XML Fiscal</h1>

<div class="upload">
    <input type="file" id="xmlFiles" multiple accept=".xml">
</div>

<div class="cards">

    <div class="card">
        <h2>Total das Notas</h2>
        <p id="totalNotas">R$ 0,00</p>
    </div>

    <div class="card">
        <h2>Total Base ICMS</h2>
        <p id="totalBase">R$ 0,00</p>
    </div>

    <div class="card">
        <h2>Total Valor ICMS</h2>
        <p id="totalICMS">R$ 0,00</p>
    </div>

    <div class="card">
        <h2>Total XMLs</h2>
        <p id="totalArquivos">0</p>
    </div>

</div>

<button class="exportar" onclick="exportarExcel()">
📥 Exportar XLSX
</button>

<div class="tabs">
    <button class="tab active" onclick="abrirAba('resumo')">
        Resumo CFOP
    </button>

    <button class="tab" onclick="abrirAba('detalhes')">
        Notas Detalhadas
    </button>
</div>

<div id="resumo" class="content active">

<table>

<thead>
<tr>
    <th>CFOP</th>
    <th>Alíquota</th>
    <th>Base ICMS</th>
    <th>Valor ICMS</th>
</tr>
</thead>

<tbody id="tbodyResumo"></tbody>

</table>

</div>

<div id="detalhes" class="content">

<table>

<thead>
<tr>
    <th>Arquivo</th>
    <th>Número NF</th>
    <th>Emitente</th>
    <th>Data</th>
    <th>CFOP</th>
    <th>Alíquota</th>
    <th>Base ICMS</th>
    <th>Valor ICMS</th>
    <th>Total Nota</th>
</tr>
</thead>

<tbody id="tbodyDetalhes"></tbody>

</table>

</div>

</div>

<script>

let dadosExcel = [];

function abrirAba(id){

    document.querySelectorAll('.content')
        .forEach(el=>el.classList.remove('active'));

    document.querySelectorAll('.tab')
        .forEach(el=>el.classList.remove('active'));

    document.getElementById(id)
        .classList.add('active');

    event.target.classList.add('active');

}

document.getElementById('xmlFiles')
.addEventListener('change', async (e)=>{

    const files = e.target.files;

    let totalNotas = 0;
    let totalBase = 0;
    let totalICMS = 0;

    let resumo = {};

    dadosExcel = [];

    document.getElementById('tbodyResumo').innerHTML = '';
    document.getElementById('tbodyDetalhes').innerHTML = '';

    for(const file of files){

        const texto = await file.text();

        const parser = new DOMParser();

        const xml = parser.parseFromString(texto,"text/xml");

        const nNF =
            xml.getElementsByTagName('nNF')[0]?.textContent || '';

        const emitente =
            xml.getElementsByTagName('xNome')[0]?.textContent || '';

        const data =
            xml.getElementsByTagName('dhEmi')[0]?.textContent || '';

        const totalNota =
            parseFloat(
                xml.getElementsByTagName('vNF')[0]?.textContent || 0
            );

        totalNotas += totalNota;

        const dets = xml.getElementsByTagName('det');

        for(let det of dets){

            const cfop =
                det.getElementsByTagName('CFOP')[0]?.textContent || '';

            const vBC =
                parseFloat(
                    det.getElementsByTagName('vBC')[0]?.textContent || 0
                );

            const pICMS =
                parseFloat(
                    det.getElementsByTagName('pICMS')[0]?.textContent || 0
                );

            const vICMS =
                parseFloat(
                    det.getElementsByTagName('vICMS')[0]?.textContent || 0
                );

            totalBase += vBC;
            totalICMS += vICMS;

            const chave = cfop + "_" + pICMS;

            if(!resumo[chave]){

                resumo[chave] = {
                    cfop:cfop,
                    aliquota:pICMS,
                    base:0,
                    icms:0
                };

            }

            resumo[chave].base += vBC;
            resumo[chave].icms += vICMS;

            document.getElementById('tbodyDetalhes')
            .innerHTML += `

            <tr>
                <td>${file.name}</td>
                <td>${nNF}</td>
                <td>${emitente}</td>
                <td>${data.substring(0,10)}</td>
                <td>${cfop}</td>
                <td>${pICMS.toFixed(2)}%</td>
                <td>${formatar(vBC)}</td>
                <td>${formatar(vICMS)}</td>
                <td>${formatar(totalNota)}</td>
            </tr>

            `;

            dadosExcel.push({
                Arquivo:file.name,
                NumeroNF:nNF,
                Emitente:emitente,
                Data:data.substring(0,10),
                CFOP:cfop,
                Aliquota:pICMS,
                BaseICMS:vBC,
                ValorICMS:vICMS,
                TotalNota:totalNota
            });

        }

    }

    Object.values(resumo).forEach(item=>{

        document.getElementById('tbodyResumo')
        .innerHTML += `

        <tr>
            <td>${item.cfop}</td>
            <td>${item.aliquota.toFixed(2)}%</td>
            <td>${formatar(item.base)}</td>
            <td>${formatar(item.icms)}</td>
        </tr>

        `;

    });

    document.getElementById('totalNotas')
        .innerText = formatar(totalNotas);

    document.getElementById('totalBase')
        .innerText = formatar(totalBase);

    document.getElementById('totalICMS')
        .innerText = formatar(totalICMS);

    document.getElementById('totalArquivos')
        .innerText = files.length;

});

function exportarExcel(){

    const ws = XLSX.utils.json_to_sheet(dadosExcel);

    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb, ws, "XML Fiscal");

    XLSX.writeFile(wb, "relatorio_xml.xlsx");

}

function formatar(valor){

    return valor.toLocaleString('pt-BR',{
        style:'currency',
        currency:'BRL'
    });

}

</script>

</body>
</html>
