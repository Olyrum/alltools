<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadro de Atualizações - Stor Sistemas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .tab-active { border-bottom: 4px solid #02727e; color: #02727e; font-weight: 900; }
        .grid-header { background-color: #333; color: white; text-transform: uppercase; font-size: 12px; font-weight: 900; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
    </style>
</head>
<body class="pb-12">

    <nav class="bg-white shadow-md mb-6 border-b border-gray-300">
        <div class="max-w-[95%] mx-auto flex font-black uppercase text-sm">
            <button onclick="showTab('pendentes')" id="btn-tab-pendentes" class="flex-1 py-5 tab-active">📋 Quadro Ativo</button>
            <button onclick="showTab('finalizadas')" id="btn-tab-finalizadas" class="flex-1 py-5 text-gray-600">📂 Finalizadas</button>
        </div>
    </nav>

    <main class="max-w-[95%] mx-auto">
        
        <div id="area-input" class="bg-white p-6 rounded-xl shadow-lg border border-gray-300 mb-8">
            <h2 class="text-[#02727e] font-black uppercase mb-4 flex items-center gap-2">
                <span>➕ Nova Atualização / O.S</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 lg:grid-cols-7 gap-4 items-end">
                <div>
                    <label class="block text-[10px] font-black text-gray-700 uppercase">Data</label>
                    <input type="date" id="f-data" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-700 uppercase">Hora</label>
                    <input type="time" id="f-hora" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-700 uppercase">Cliente</label>
                    <input type="text" id="f-cliente" placeholder="Razão Social" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none uppercase">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-700 uppercase">Cidade</label>
                    <input type="text" id="f-cidade" placeholder="Ex: Maringá" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none uppercase">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-700 uppercase">Analista</label>
                    <input type="text" id="f-analista" placeholder="Seu nome" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none uppercase">
                </div>
                <div>
                    <label class="block text-[10px] font-black text-gray-700 uppercase">Situação</label>
                    <select id="f-situacao" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none">
                        <option value="AGUARDANDO">AGUARDANDO</option>
                        <option value="EM ANDAMENTO">EM ANDAMENTO</option>
                        <option value="PENDENTE CLIENTE">PENDENTE CLIENTE</option>
                        <option value="URGENTE">URGENTE</option>
                    </select>
                </div>
                <button onclick="adicionarOS()" class="bg-[#02727e] text-white font-black py-2.5 rounded hover:brightness-110 transition uppercase text-xs">Adicionar</button>
            </div>
            <div class="mt-4">
                <label class="block text-[10px] font-black text-gray-700 uppercase">Observação</label>
                <textarea id="f-obs" rows="1" class="w-full border-2 border-gray-300 rounded p-2 font-bold focus:border-[#02727e] outline-none uppercase"></textarea>
            </div>
        </div>

        <div id="tab-pendentes" class="overflow-x-auto bg-white rounded-xl shadow-xl border border-gray-300">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="grid-header">
                        <th class="p-4 border-b border-black">Data/Hora</th>
                        <th class="p-4 border-b border-black">Cliente / Cidade</th>
                        <th class="p-4 border-b border-black">Analista</th>
                        <th class="p-4 border-b border-black">Situação</th>
                        <th class="p-4 border-b border-black">Observação</th>
                        <th class="p-4 border-b border-black text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpo-grid" class="divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>

        <div id="tab-finalizadas" class="hidden overflow-x-auto bg-white rounded-xl shadow-xl border border-gray-300">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="grid-header bg-gray-700">
                        <th class="p-4">Finalizado em</th>
                        <th class="p-4">Cliente</th>
                        <th class="p-4">Analista</th>
                        <th class="p-4">Observação Final</th>
                        <th class="p-4 text-center">Status</th>
                    </tr>
                </thead>
                <tbody id="corpo-finalizadas" class="divide-y divide-gray-200">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('stor_quadro_os') || '{"ativos":[], "finalizados":[]}');

        function atualizarTelas() {
            renderAtivos();
            renderFinalizados();
            localStorage.setItem('stor_quadro_os', JSON.stringify(db));
        }

        function showTab(tab) {
            document.getElementById('tab-pendentes').style.display = tab === 'pendentes' ? 'block' : 'none';
            document.getElementById('tab-finalizadas').style.display = tab === 'finalizadas' ? 'block' : 'none';
            document.getElementById('area-input').style.display = tab === 'pendentes' ? 'block' : 'none';
            document.getElementById('btn-tab-pendentes').className = tab === 'pendentes' ? 'flex-1 py-5 tab-active' : 'flex-1 py-5 text-gray-600';
            document.getElementById('btn-tab-finalizadas').className = tab === 'finalizadas' ? 'flex-1 py-5 tab-active' : 'flex-1 py-5 text-gray-600';
        }

        function adicionarOS() {
            const nova = {
                id: Date.now(),
                data: document.getElementById('f-data').value,
                hora: document.getElementById('f-hora').value,
                cliente: document.getElementById('f-cliente').value,
                cidade: document.getElementById('f-cidade').value,
                analista: document.getElementById('f-analista').value,
                situacao: document.getElementById('f-situacao').value,
                obs: document.getElementById('f-obs').value
            };

            if(!nova.cliente) return alert('Informe o cliente!');
            db.ativos.push(nova);
            atualizarTelas();
            limparForm();
        }

        function renderAtivos() {
            const corpo = document.getElementById('corpo-grid');
            corpo.innerHTML = db.ativos.map(item => `
                <tr class="hover:bg-gray-50 font-bold text-gray-900 text-sm">
                    <td class="p-4">${item.data.split('-').reverse().join('/')}<br><span class="text-[#02727e]">${item.hora}</span></td>
                    <td class="p-4 uppercase">${item.cliente}<br><span class="text-xs text-gray-500">${item.cidade}</span></td>
                    <td class="p-4 uppercase">${item.analista}</td>
                    <td class="p-4">
                        <select onchange="editarCampo(${item.id}, 'situacao', this.value)" class="bg-gray-100 border border-gray-300 rounded p-1 text-xs">
                            <option value="AGUARDANDO" ${item.situacao === 'AGUARDANDO' ? 'selected' : ''}>AGUARDANDO</option>
                            <option value="EM ANDAMENTO" ${item.situacao === 'EM ANDAMENTO' ? 'selected' : ''}>EM ANDAMENTO</option>
                            <option value="PENDENTE CLIENTE" ${item.situacao === 'PENDENTE CLIENTE' ? 'selected' : ''}>PENDENTE CLIENTE</option>
                            <option value="URGENTE" ${item.situacao === 'URGENTE' ? 'selected' : ''}>URGENTE</option>
                        </select>
                    </td>
                    <td class="p-4">
                        <input type="text" value="${item.obs}" onblur="editarCampo(${item.id}, 'obs', this.value)" class="w-full bg-transparent border-b border-transparent hover:border-gray-400 outline-none uppercase text-xs">
                    </td>
                    <td class="p-4 text-center flex gap-2 justify-center">
                        <button onclick="finalizarOS(${item.id})" class="bg-green-600 text-white px-3 py-1.5 rounded text-[10px] uppercase font-black hover:bg-green-700">Concluir</button>
                        <button onclick="excluirOS(${item.id})" class="text-red-500 hover:text-red-700 font-black text-[10px] uppercase">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderFinalizados() {
            const corpo = document.getElementById('corpo-finalizadas');
            corpo.innerHTML = db.finalizados.map(item => `
                <tr class="bg-gray-50 font-bold text-gray-500 text-sm">
                    <td class="p-4 italic">${new Date(item.idFinal).toLocaleString()}</td>
                    <td class="p-4 uppercase">${item.cliente}</td>
                    <td class="p-4 uppercase">${item.analista}</td>
                    <td class="p-4 uppercase text-xs">${item.obs}</td>
                    <td class="p-4 text-center"><span class="status-badge bg-gray-200">FINALIZADA</span></td>
                </tr>
            `).join('');
        }

        function editarCampo(id, campo, valor) {
            const item = db.ativos.find(i => i.id === id);
            if(item) {
                item[campo] = valor;
                atualizarTelas();
            }
        }

        function finalizarOS(id) {
            const index = db.ativos.findIndex(i => i.id === id);
            const item = db.ativos.splice(index, 1)[0];
            item.idFinal = Date.now();
            db.finalizados.unshift(item);
            atualizarTelas();
        }

        function excluirOS(id) {
            if(confirm('Remover esta atualização?')) {
                db.ativos = db.ativos.filter(i => i.id !== id);
                atualizarTelas();
            }
        }

        function limparForm() {
            document.getElementById('f-cliente').value = '';
            document.getElementById('f-cidade').value = '';
            document.getElementById('f-obs').value = '';
        }

        // Init
        document.getElementById('f-data').valueAsDate = new Date();
        const agora = new Date();
        document.getElementById('f-hora').value = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
        atualizarTelas();
    </script>
</body>
</html>
